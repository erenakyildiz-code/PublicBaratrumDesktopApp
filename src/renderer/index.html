    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background-color: transparent !important; 
      -webkit-app-region: drag; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }
    
    canvas { 
      display: block; 
    }
    
    /* Main wrapper to keep UI centered and organized at the bottom */
    #ui-wrapper {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 80%;
      max-width: 700px; 
      pointer-events: none; 
      -webkit-app-region: no-drag;
    }

    /* Transparent, auto-sizing text area */
    #chatInput {
      pointer-events: auto; 
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      color: white;
      padding: 12px 20px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      width: 100%;
      box-sizing: border-box;
      resize: none; 
      overflow-x: hidden;
      min-height: 46px; 
      max-height: 200px; /* It stops growing here and the scrollbar appears */
      line-height: 1.4;
      transition: background 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      
      /* Firefox Scrollbar Fallback */
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
    }

    #chatInput:focus {
      background: rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.4);
    }

    #chatInput::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    /* --- THE COOL CUSTOM SCROLLBAR --- */
    /* Width of the scrollbar itself */
    #chatInput::-webkit-scrollbar {
      width: 8px;
    }

    /* The track (background) - making it fully transparent */
    #chatInput::-webkit-scrollbar-track {
      background: transparent;
      margin-top: 10px; /* Keeps the pill from hitting the very top border */
      margin-bottom: 10px;
    }

    /* The draggable thumb (the pill) */
    #chatInput::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
    }

    /* Less transparent when you hover or click the pill */
    #chatInput::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Container for bottom buttons */
    #ui-container {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px; 
      flex-wrap: wrap;
      width: 100%;
    }

    /* Glassmorphism styling for buttons and select */
    select, button {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Make the select box smaller */
    select {
      flex-grow: 0;
      width: auto;
      max-width: 180px;
      text-overflow: ellipsis;
    }

    select option {
      background: #222; 
      color: white;
    }

    /* Hover animations */
    button:hover, select:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0px);
    }

    /* Send button accent */
    #sendBtn {
      background: rgba(0, 120, 0, 0.4);
      border-color: rgba(0, 120, 0, 0.6);
    }
    
    #sendBtn:hover {
      background: rgba(0, 120, 0, 0.7);
    }

    #tokenCnt {
    /* Aesthetics */
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);

}

/* Ensure the critical blink class works */
.status-critical {

}

@keyframes blink {

    50% { opacity: 0.5; }

}

  <script>
    const textarea = document.getElementById("chatInput");
    function adjustHeight() {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
      
      if (textarea.scrollHeight > 200) {
        textarea.style.overflowY = "auto";
      } else {
        textarea.style.overflowY = "hidden";
      }
    }

    textarea.addEventListener("input", adjustHeight);
    adjustHeight();
    
  </script>
